<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PIRATE TEAM | Mine Gold</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="app-loader" style="display:none;"></div>

<div id="verification-modal" class="modal" style="display:none;">
    <div class="modal-content glass-modal modern-modal gold-modal">
        <div class="modal-header gold-header">
            <h3><i class="fas fa-shield-alt"></i> Verification Required</h3>
        </div>
        <div class="modal-body">
            <p style="text-align:center;color:#888;margin-bottom:16px;">Enter the 5-digit code sent to your Telegram</p>
            <div class="form-group">
                <input type="text" id="verification-input" class="form-input gold-input" placeholder="Enter code" maxlength="5" autocomplete="off" style="text-align:center;font-size:1.5rem;letter-spacing:8px;">
            </div>
            <button id="verify-btn" class="modern-support-btn gold-btn">Verify</button>
            <button id="resend-code-btn" class="modern-support-btn" style="background:transparent;color:#888;margin-top:8px;font-size:0.8rem;">Resend Code</button>
            <div id="verification-error" style="color:var(--error);text-align:center;margin-top:8px;display:none;"></div>
        </div>
    </div>
</div>

<div id="app" style="display:none;">
    <header class="app-header pirate-header">
        <div class="header-top">
            <div class="user-info">
                <div class="avatar-wrapper">
                    <img id="user-photo" class="user-avatar" src="https://i.ibb.co/XxXhyZYf/file-000000006f8c720e9ab4c76b6e560062.png">
                    <div class="avatar-badge level-badge gold-badge" id="user-level-badge">1</div>
                </div>
                <div class="user-details">
                    <span id="user-name" class="user-name">User</span>
                    <div class="user-level gold-text"><i class="fas fa-crown"></i> <span id="user-level-text">Level</span> <span id="user-level">1</span></div>
                </div>
            </div>
            <div class="header-actions">
                <div class="header-balances" id="header-balances">
                    <div class="header-balance" id="header-power"><i class="fas fa-bolt"></i> 0</div>
                    <div class="header-balance" id="header-gold"><img src="https://cdn-icons-png.flaticon.com/512/2460/2460494.png" style="width:14px;height:14px;border-radius:50%;object-fit:cover;"> 0</div>
                </div>
            </div>
        </div>
    </header>

    <div id="lang-menu" class="lang-menu" style="display:none;">
        <div class="lang-menu-content">
            <button class="lang-option" data-lang="en" data-flag="🇬🇧">English</button>
        </div>
    </div>

    <main id="main-content">
        <div id="mining-page" class="page active"></div>
        <div id="earn-page" class="page"></div>
        <div id="team-page" class="page"></div>
        <div id="wallet-page" class="page"></div>
    </main>

    <nav class="bottom-nav pirate-nav">
        <button class="nav-btn active" data-page="mining-page"><i class="fas fa-hammer"></i><span id="nav-mining">Mining</span></button>
        <button class="nav-btn" data-page="earn-page"><i class="fas fa-coins"></i><span id="nav-earn">Earn</span></button>
        <button class="nav-btn" data-page="team-page"><i class="fas fa-skull-and-crossbones"></i><span id="nav-team">Pirates</span></button>
        <button class="nav-btn" data-page="wallet-page"><i class="fas fa-money-bill"></i><span id="nav-wallet">Wallet</span></button>
    </nav>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
