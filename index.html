<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PIRATE TEAM 🏴‍☠️</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="app-loader" style="display:none;"></div>

<div id="ban-modal" class="modal" style="display:none;">
    <div class="modal-content glass-modal modern-modal gold-modal" style="max-width:320px;width:90%;margin:0 auto;position:relative;background:rgba(15,15,15,0.95);border-radius:24px;border:1px solid rgba(255,215,0,0.12);box-shadow:0 8px 40px rgba(0,0,0,0.8);text-align:center;padding:30px 24px;">
        <div style="font-size:60px;margin-bottom:16px;">🚫</div>
        <h3 style="color:#FF4444;font-size:1.3rem;font-weight:700;margin-bottom:8px;">Account Banned</h3>
        <p style="color:var(--text-secondary);font-size:0.95rem;margin-bottom:20px;line-height:1.5;">
            Your account has been banned.<br>
            Please contact support for more information.
        </p>
        <button id="close-app-btn" class="gold-btn" style="padding:12px 40px;background:linear-gradient(135deg,#FFD700,#D4A800);border:none;border-radius:60px;color:#0a0a0f;font-weight:700;font-size:1rem;cursor:pointer;transition:all 0.2s;box-shadow:0 4px 20px rgba(255,215,0,0.3);">
            <i class="fas fa-times"></i> Close App
        </button>
    </div>
</div>

<div id="verification-modal" class="modal" style="display:flex;align-items:center;justify-content:center;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.92);backdrop-filter:blur(12px);z-index:10001;padding:20px;margin:0;">
    <div class="modal-content glass-modal modern-modal gold-modal" style="max-width:320px;width:90%;margin:0 auto;position:relative;background:rgba(15,15,15,0.95);border-radius:24px;border:1px solid rgba(255,215,0,0.12);box-shadow:0 8px 40px rgba(0,0,0,0.8);">
        <div class="modal-header gold-header" style="border-bottom:1px solid rgba(255,215,0,0.08);padding:16px 20px;">
            <h3 style="color:#FFE44D;font-size:1.1rem;display:flex;align-items:center;gap:10px;margin:0;"><i class="fas fa-shield-alt" style="color:#FFD700;"></i> Verification Required</h3>
        </div>
        <div class="modal-body" style="padding:20px 24px 24px;">
            <p style="text-align:center;color:#888;margin-bottom:20px;font-size:0.9rem;">Enter the 5-digit verification code</p>
            <div class="form-group" style="margin-bottom:20px;">
                <input type="text" id="verification-input" class="form-input gold-input" placeholder="— — — — —" maxlength="5" autocomplete="off" style="text-align:center;font-size:1.6rem;letter-spacing:10px;padding:14px 16px;width:100%;background:rgba(0,0,0,0.4);border:1px solid rgba(255,215,0,0.15);border-radius:60px;color:white;font-weight:600;">
            </div>
            <button id="verify-btn" class="modern-support-btn gold-btn" style="width:100%;padding:14px;background:linear-gradient(135deg,#FFD700,#D4A800);border:none;border-radius:60px;color:#0a0a0f;font-weight:700;font-size:1rem;cursor:pointer;transition:all 0.2s;box-shadow:0 4px 20px rgba(255,215,0,0.3);">Verify</button>
            <a href="https://t.me/GramPirateBot" target="_blank" style="display:block;text-align:center;margin-top:12px;color:#888;font-size:0.8rem;text-decoration:none;border:1px solid rgba(255,215,0,0.08);border-radius:40px;padding:10px;background:rgba(255,215,0,0.03);transition:all 0.2s;">Get Code</a>
            <button id="resend-code-btn" class="modern-support-btn" style="background:transparent;color:#666;margin-top:4px;font-size:0.75rem;padding:8px;border:none;cursor:pointer;width:100%;text-align:center;">Resend Code</button>
            <div id="verification-error" style="color:#e74c3c;text-align:center;margin-top:10px;display:none;font-size:0.85rem;"></div>
        </div>
    </div>
</div>

<div id="app" style="display:none;">
    <header class="app-header pirate-header">
        <div class="header-top">
            <div class="user-info">
                <div class="avatar-wrapper">
                    <img id="user-photo" class="user-avatar" src="https://i.ibb.co/XxXhyZYf/file-000000006f8c720e9ab4c76b6e560062.png">
                    <div class="avatar-badge level-badge gold-badge" id="user-level-badge">1</div>
                </div>
                <div class="user-details">
                    <span id="user-name" class="user-name">User</span>
                    <div class="user-level gold-text"><i class="fas fa-crown"></i> <span id="user-level-text">Level</span> <span id="user-level">1</span></div>
                </div>
            </div>
            <div class="header-actions">
                <div class="header-balances" id="header-balances">
                    <div class="header-balance" id="header-power"><i class="fas fa-bolt"></i> 0</div>
                    <div class="header-balance" id="header-gold"><img src="https://cdn-icons-png.flaticon.com/512/2460/2460494.png" style="width:14px;height:14px;border-radius:50%;object-fit:cover;"> 0</div>
                </div>
            </div>
        </div>
    </header>

    <div id="lang-menu" class="lang-menu" style="display:none;">
        <div class="lang-menu-content">
            <button class="lang-option" data-lang="en" data-flag="🇬🇧">English</button>
        </div>
    </div>

    <main id="main-content">
        <div id="mining-page" class="page active"></div>
        <div id="earn-page" class="page"></div>
        <div id="team-page" class="page"></div>
        <div id="wallet-page" class="page"></div>
    </main>

    <nav class="bottom-nav pirate-nav">
        <button class="nav-btn active" data-page="mining-page"><i class="fas fa-anchor"></i><span id="nav-mining">Mining</span></button>
        <button class="nav-btn" data-page="earn-page"><i class="fas fa-coins"></i><span id="nav-earn">Earn</span></button>
        <button class="nav-btn" data-page="team-page"><i class="fas fa-user-tie"></i><span id="nav-team">Pirates</span></button>
        <button class="nav-btn" data-page="wallet-page"><i class="fas fa-money-bill"></i><span id="nav-wallet">Wallet</span></button>
    </nav>
</div>

<script type="module" src="js/app.js"></script>
</body>
                                                                                                                               </html>
